<!--
  ╔══════════════════════════════════════════════════════════════════╗
  ║  MASTERS IN TELECOM — COOKIEMELDING + GOOGLE ANALYTICS SNIPPET  ║
  ║  Plaats dit blok in de <head> van elke pagina.                  ║
  ║  De Google tag laadt alleen na expliciete toestemming.          ║
  ╚══════════════════════════════════════════════════════════════════╝

  WAT BEWAARD BLIJFT VAN DE BESTAANDE SETUP:
  - GA4-tag G-STY5S3NRKH (dezelfde Property ID als op de oude site)
  - Cookiebanner in de MiT-huisstijl (paars #3B0256 achtergrond,
    roze/rood #D60B52 als primaire knop, Poppins font)
  - Nederlandse teksten
  - "ask-opt-in" consent-model (GDPR-conform)

  WAT VERBETERD IS:
  - Google Analytics start pas NA toestemming (Consent Mode v2)
  - Voorkeur wordt 365 dagen bewaard in localStorage
  - Geen externe cookie-consent bibliotheek nodig
  - Minimale code, volledig self-hosted
-->

<!-- ═══ 1. CONSENT MODE v2 — zet dit BOVENAAN <head>, vóór gtag.js ═══ -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  // Standaard: alles geweigerd totdat de gebruiker kiest
  gtag('consent', 'default', {
    ad_storage:            'denied',
    analytics_storage:     'denied',
    ad_user_data:          'denied',
    ad_personalization:    'denied',
    wait_for_update:       500
  });
</script>

<!-- ═══ 2. GOOGLE TAG — laadt altijd, maar meet pas na toestemming ═══ -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-STY5S3NRKH"></script>
<script>
  gtag('js', new Date());
  gtag('config', 'G-STY5S3NRKH', { anonymize_ip: true });
</script>

<!-- ═══ 3. COOKIE CONSENT LOGICA ═══ -->
<script>
(function() {
  var STORAGE_KEY = 'mit_cookie_consent';
  var EXPIRY_DAYS = 365;

  function setConsent(analytics) {
    gtag('consent', 'update', {
      analytics_storage: analytics ? 'granted' : 'denied'
    });
    var expiry = new Date();
    expiry.setDate(expiry.getDate() + EXPIRY_DAYS);
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      analytics: analytics,
      timestamp: Date.now(),
      expiry: expiry.toISOString()
    }));
  }

  function hideBanner() {
    var banner = document.getElementById('mit-cookie-banner');
    if (banner) banner.style.display = 'none';
  }

  function showBanner() {
    var banner = document.getElementById('mit-cookie-banner');
    if (banner) banner.style.display = 'flex';
  }

  // Check bestaande voorkeur
  var stored = localStorage.getItem(STORAGE_KEY);
  if (stored) {
    try {
      var data = JSON.parse(stored);
      if (data.expiry && new Date(data.expiry) > new Date()) {
        setConsent(data.analytics);
        // Banner hoeft niet getoond: voorkeur al bekend
        document.addEventListener('DOMContentLoaded', hideBanner);
        return;
      }
    } catch(e) {}
  }

  // Geen voorkeur gevonden: toon banner na laden pagina
  document.addEventListener('DOMContentLoaded', function() {
    showBanner();

    document.getElementById('mit-accept-all').addEventListener('click', function() {
      setConsent(true);
      hideBanner();
    });

    document.getElementById('mit-accept-essential').addEventListener('click', function() {
      setConsent(false);
      hideBanner();
    });
  });
})();
</script>
